services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiketnonton_app
    restart: unless-stopped
    ports:
      - "8092:8000"
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=tiketnonton_db
      - DB_USERNAME=tiketnonton
      - DB_PASSWORD=GDbfVZs3hyG9WIMS264H
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel-net
    # Command ini memastikan npm install, build assets, dan migrasi jalan sebelum server start
    # Run as root untuk install npm, lalu switch ke laravel user di entrypoint
    user: root
    command: ["/usr/local/bin/docker-entrypoint.sh"]

  db:
    image: mysql:8.0
    container_name: tiketnonton_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tiketnonton_db
      MYSQL_ROOT_PASSWORD: GDbfVZs3hyG9WIMS264H
      MYSQL_USER: tiketnonton
      MYSQL_PASSWORD: GDbfVZs3hyG9WIMS264H
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pGDbfVZs3hyG9WIMS264H"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Opsional: Redis untuk Queue/Cache Filament (Sangat disarankan untuk performa)
  redis:
    image: redis:alpine
    container_name: tiketnonton_redis
    restart: unless-stopped
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  db_data: